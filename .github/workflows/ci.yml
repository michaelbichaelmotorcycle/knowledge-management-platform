# .github/workflows/ci.yml
#
# CI pipeline for the Knowledge Management Assistant Alpha release.
# Stages map to Must-have backlog IDs (see Unit 5 Alpha scope notes):
#   build         -> IDs 1, 2   (repo init, architecture boundaries)
#   db-schema     -> IDs 3, 4   (pgvector setup, schema)
#   ingestion     -> IDs 5, 6, 7 (upload, text extraction, chunking)
#   embed-store   -> IDs 8, 9   (embeddings, storage)
#   retrieval     -> ID 10      (semantic search)
#   rag-llm       -> IDs 11, 13 (LLM integration, RAG context assembly)
#   e2e-smoke     -> IDs 12, 15 (grounded Q&A, source attribution)
#   auth          -> ID 18      (basic authenticated access)
#
# LLM/embedding calls are MOCKED in this pipeline (see notes below) —
# real-API verification is a separate manual step before the Alpha demo.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # Flip to "true" locally/manually if you ever want a real-API smoke run.
  USE_MOCK_LLM: "true"

jobs:
  # ---------------------------------------------------------------------
  # 1. Build & lint — confirms both services install and compile cleanly
  # ---------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint backend
        working-directory: ./backend
        run: |
          pip install ruff
          ruff check .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  # ---------------------------------------------------------------------
  # 2. DB schema — spins up Postgres+pgvector, applies migrations
  # ---------------------------------------------------------------------
  db-schema:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: ankane/pgvector
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Run migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/kma_test
        run: alembic upgrade head   # swap for your actual migration tool

# ---------------------------------------------------------------------
# 3. Ingestion pipeline tests — upload, extraction, chunking
# ---------------------------------------------------------------------
ingestion:
  runs-on: ubuntu-latest
  needs: db-schema
  services:
    postgres:
      image: ankane/pgvector
      env:
        POSTGRES_USER: test
        POSTGRES_PASSWORD: test
        POSTGRES_DB: kma_test
      ports:
        - 5432:5432
      options: >-
        --health-cmd "pg_isready -U test"
        --health-interval 10s
        --health-timeout 5s
        --health-retries 5
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      working-directory: ./backend
      run: pip install -r requirements.txt
    - name: Run migrations
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/kma_test
      run: alembic upgrade head
    - name: Run ingestion unit tests
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/kma_test
      run: pytest tests/ -k "upload or extraction or chunking" -v

  # ---------------------------------------------------------------------
  # 4. Embedding + storage tests
  # ---------------------------------------------------------------------
  embed-store:
    runs-on: ubuntu-latest
    needs: db-schema
    services:
      postgres:
        image: ankane/pgvector
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kma_test
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt
      - name: Run migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/kma_test
        run: alembic upgrade head
      - name: Run embedding + storage tests (mocked embedding calls)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/kma_test
          USE_MOCK_LLM: ${{ env.USE_MOCK_LLM }}
        run: pytest tests/test_embeddings.py tests/test_storage.py -v

  # ---------------------------------------------------------------------
  # 5. Retrieval integration test — seeded dataset, known query -> known chunk
  # ---------------------------------------------------------------------
  retrieval:
    runs-on: ubuntu-latest
    needs: embed-store
    services:
      postgres:
        image: ankane/pgvector
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kma_test
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt
      - name: Seed test dataset
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/kma_test
        run: python scripts/seed_test_data.py
      - name: Run retrieval tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/kma_test
        run: pytest tests/test_retrieval.py -v

  # ---------------------------------------------------------------------
  # 6. RAG / LLM integration test — mocked LLM, checks prompt assembly
  # ---------------------------------------------------------------------
  rag-llm:
    runs-on: ubuntu-latest
    needs: retrieval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt
      - name: Run RAG/LLM integration tests (mocked LLM)
        working-directory: ./backend
        env:
          USE_MOCK_LLM: "true"
        run: pytest tests/test_rag_integration.py -v

  # ---------------------------------------------------------------------
  # 7. End-to-end smoke test — the two Must-have user stories:
  #    ask a question -> grounded answer with cited sources
  # ---------------------------------------------------------------------
  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [rag-llm, auth]
    services:
      postgres:
        image: ankane/pgvector
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kma_test
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt
      - name: Seed test dataset
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/kma_test
        run: python scripts/seed_test_data.py
      - name: Run end-to-end smoke test (representative question set, mocked LLM)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/kma_test
          USE_MOCK_LLM: "true"
        run: pytest tests/test_e2e_qa.py -v
        # test_e2e_qa.py should walk the ~8-10 representative questions
        # from NFR-12 and assert each answer cites a source chunk.

  # ---------------------------------------------------------------------
  # 8. Auth check — unauthenticated requests to protected endpoints fail
  # ---------------------------------------------------------------------
  auth:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt
      - name: Run auth tests
        working-directory: ./backend
        env:
          JWT_SECRET_KEY: "test-secret-key-for-ci-only"
        run: pytest tests/test_auth.py -v
